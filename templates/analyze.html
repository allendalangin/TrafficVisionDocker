{% extends 'base.html' %}
{% block content %}
<div class="hero-card premium-shell">
  <div class="hero-copy">
    <p class="eyebrow">Single image analysis</p>
    <h2>Turn a traffic photo into instant insights</h2>
    <p class="hero-text">Upload a single image and receive a precise, confidence-based classification summary in seconds.</p>
  </div>
  <div class="panel-card">
    <form method="post" enctype="multipart/form-data" class="upload-form">
      <div class="field-group">
        <label class="field-label" for="image">Select image</label>
        <input class="file-input" type="file" id="image" name="image" accept="image/*" required>
      </div>

      <div class="field-group">
        <label class="field-label" for="confidence_threshold">Confidence threshold</label>
        <input class="input-control" type="number" id="confidence_threshold" name="confidence_threshold" min="0" max="1" step="0.01" value="0.5">
      </div>

      <button class="btn btn-primary" type="submit">Run analysis</button>
    </form>
  </div>
</div>
{% endblock %}
