{% extends 'base.html' %}
{% block content %}
<div class="hero-card premium-shell">
  <div class="hero-copy">
    <p class="eyebrow">Batch processing</p>
    <h2>Scale analysis across a full set of traffic images</h2>
    <p class="hero-text">Upload multiple photos at once and review each result with a concise, premium workflow.</p>
  </div>
  <div class="panel-card">
    <form method="post" enctype="multipart/form-data" class="upload-form">
      <div class="field-group">
        <label class="field-label" for="images">Select images</label>
        <input class="file-input" type="file" id="images" name="images" accept="image/*" multiple required>
      </div>

      <div class="field-group">
        <label class="field-label" for="confidence_threshold">Confidence threshold</label>
        <input class="input-control" type="number" id="confidence_threshold" name="confidence_threshold" min="0" max="1" step="0.01" value="0.5">
      </div>

      <button class="btn btn-primary" type="submit">Run batch analysis</button>
    </form>
  </div>
</div>
{% endblock %}
